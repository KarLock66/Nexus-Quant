# Nexus Quant — local stack
# Usage (from repo root):
#   docker compose -f docker/docker-compose.yml up -d postgres redis   # infra only
#   docker compose -f docker/docker-compose.yml up --build             # full stack

name: nexus-quant

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_password
      POSTGRES_DB: nexus_quant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_quant"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  quant:
    build:
      context: ..
      dockerfile: docker/quant.Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    environment:
      DATABASE_URL: postgresql://nexus:nexus_dev_password@postgres:5432/nexus_quant
      REDIS_URL: redis://redis:6379
      QUANT_SERVICE_URL: http://quant:8000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      quant:
        condition: service_healthy

  ingestion:
    build:
      context: ..
      dockerfile: docker/node-service.Dockerfile
      args:
        SERVICE: ingestion
    environment:
      DATABASE_URL: postgresql://nexus:nexus_dev_password@postgres:5432/nexus_quant
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  workers:
    build:
      context: ..
      dockerfile: docker/node-service.Dockerfile
      args:
        SERVICE: workers
    environment:
      DATABASE_URL: postgresql://nexus:nexus_dev_password@postgres:5432/nexus_quant
      REDIS_URL: redis://redis:6379
      QUANT_SERVICE_URL: http://quant:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
